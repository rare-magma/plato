[package]
name = "miniflux"
version = "0.9.45"
edition = "2021"

[[bin]]
name = "miniflux"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dependencies.reqwest]
version = "0.13.1"
features = ["blocking", "json", "query", "rustls"]
default-features = false
